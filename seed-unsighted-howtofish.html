<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Seed links</title></head>
<body style="font-family:sans-serif;padding:40px;background:#0f172a;color:#f1f5f9;">
<h2>Diagnóstico + Guardar links</h2>
<div id="resultado">Cargando...</div>
<script>
async function seed() {
  const ADMIN_URL = "https://ort-admin.simonabulafia.workers.dev";
  const ADMIN_USER = "788622cam";
  const ADMIN_PASS = "estalocura";
  const resultado = document.getElementById("resultado");
  let log = "";

  // TEST A: login SIN el header X-Proxy-Secret (para aislar si el problema es el preflight)
  try {
    log += "TEST A — login SIN X-Proxy-Secret (solo Content-Type)...<br>";
    resultado.innerHTML = log;
    const rA = await fetch(ADMIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "admin_login", username: ADMIN_USER, password: ADMIN_PASS })
    });
    log += `  status: ${rA.status}<br>`;
    const dA = await rA.json();
    log += `  respuesta: ${JSON.stringify(dA)}<br><br>`;
    resultado.innerHTML = log;

    if (dA.ok) {
      // Si esto funcionó, seguimos guardando los links SIN el header custom
      log += "✅ El login funcionó sin X-Proxy-Secret. El origen https://juegosort.pages.dev ya es aceptado directamente.<br><br>";
      resultado.innerHTML = log;

      const juegos = [
        { dl: "unsighted", url: "https://github.com/hotwelj/cjvhjgygghvghj/releases/download/Unsighted/UNSIGHTED.v1.1.4.zip" },
        { dl: "how-to-fish", url: "https://github.com/hotwelj/cjvhjgygghvghj/releases/download/How-to-fish/How.to.Fish.v1.0.12.zip" }
      ];
      for (const j of juegos) {
        log += `Guardando ${j.dl}...<br>`;
        resultado.innerHTML = log;
        const saveRes = await fetch(ADMIN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "save_link", adminToken: dA.adminToken, dl: j.dl, url: j.url })
        });
        log += `  status: ${saveRes.status}<br>`;
        const saveData = await saveRes.json();
        log += saveData.ok ? `  <span style="color:#22c55e">✅ OK</span><br><br>` : `  <span style="color:#ef4444">❌ ${JSON.stringify(saveData)}</span><br><br>`;
        resultado.innerHTML = log;
      }
      return;
    }
  } catch (e) {
    log += `  <span style="color:#ef4444">TEST A FALLÓ: ${e.name}: ${e.message}</span><br><br>`;
    resultado.innerHTML = log;
  }

  // TEST B: si A falló, probamos CON el header para comparar
  try {
    log += "TEST B — login CON X-Proxy-Secret...<br>";
    resultado.innerHTML = log;
    const rB = await fetch(ADMIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Proxy-Secret": "js-pages-proxy-2024" },
      body: JSON.stringify({ action: "admin_login", username: ADMIN_USER, password: ADMIN_PASS })
    });
    log += `  status: ${rB.status}<br>`;
    const dB = await rB.json();
    log += `  respuesta: ${JSON.stringify(dB)}<br>`;
  } catch (e) {
    log += `  <span style="color:#ef4444">TEST B FALLÓ: ${e.name}: ${e.message}</span><br>`;
  }
  resultado.innerHTML = log;
}
seed();
</script>
</body>
</html>
