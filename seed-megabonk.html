<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Seed link — Megabonk</title></head>
<body style="font-family:sans-serif;padding:40px;background:#0f172a;color:#f1f5f9;">
<h2>Guardando link de Megabonk...</h2>
<div id="resultado">Cargando...</div>
<script>
async function seed() {
  const ADMIN_URL = "https://ort-admin.simonabulafia.workers.dev";
  const ADMIN_USER = "788622cam";
  const ADMIN_PASS = "estalocura";
  const dl = "megabonk";
  const url = "https://github.com/hotwelj/cjvhjgygghvghj/releases/download/Megabonk/Megabonk.v1.0.65.zip";
  const headers = { "Content-Type": "application/json" };

  const resultado = document.getElementById("resultado");
  try {
    const loginRes = await fetch(ADMIN_URL, { method: "POST", headers, body: JSON.stringify({ action: "admin_login", username: ADMIN_USER, password: ADMIN_PASS }) });
    const loginData = await loginRes.json();
    if (!loginData.ok) { resultado.innerHTML = "❌ No se pudo autenticar como admin."; return; }

    const saveRes = await fetch(ADMIN_URL, { method: "POST", headers, body: JSON.stringify({ action: "save_link", adminToken: loginData.adminToken, dl, url }) });
    const saveData = await saveRes.json();
    resultado.innerHTML = saveData.ok
      ? `<p style="color:#22c55e">✅ Link guardado correctamente para dl="${dl}"</p>`
      : `<p style="color:#ef4444">❌ Error al guardar: ${JSON.stringify(saveData)}</p>`;
  } catch (e) { resultado.innerHTML = "❌ Error: " + e.message; }
}
seed();
</script>
</body>
</html>
